name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[numpy,dev]"

      - name: Run tests (excluding benchmarks)
        run: pytest -m "not benchmark" -v --tb=short --benchmark-disable

      - name: Run benchmarks (Linux only)
        if: runner.os == 'Linux'
        run: |
          pytest tests/test_benchmarks.py -v --benchmark-save=ci-baseline --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: |
            benchmark-results.json
            .benchmarks/
